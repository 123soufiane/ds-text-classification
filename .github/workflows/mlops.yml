name: MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt || pip install scikit-learn pandas joblib
      - name: Train
        run: python text_classify.py
      - name: Deploy
        run: |
          pip install fastapi uvicorn joblib pandas scikit-learn || true
          uvicorn deploy:app --host 0.0.0.0 --port 8000 &
      - name: Deploy to own server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            cd /path/to/app
            git pull
            . .venv/bin/activate || python -m venv .venv
            pip install -r requirements.txt || pip install fastapi uvicorn joblib pandas scikit-learn
            nohup uvicorn deploy:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
      - name: Commit model artifact
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add model/
          git commit -m 'auto: update model' || echo 'No changes'
          git push || echo 'Push skipped'
