name: MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt || pip install scikit-learn pandas joblib
      - name: Train
        run: python text_classify.py
      - name: Commit model artifact
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add model/
          git commit -m 'auto: update model' || echo 'No changes'
          git push || echo 'Push skipped'
