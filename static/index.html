<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Review sentiment</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 620px);
        padding: clamp(24px, 5vw, 44px);
        border: 1px solid #e1e6f0;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 50px #26395d12;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #5266c5;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        letter-spacing: -0.04em;
      }

      .intro {
        margin: 12px 0 28px;
        color: #5e687d;
        line-height: 1.6;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.95rem;
        font-weight: 650;
      }

      textarea {
        width: 100%;
        min-height: 150px;
        resize: vertical;
        padding: 14px 16px;
        border: 1px solid #cbd3e1;
        border-radius: 12px;
        color: inherit;
        font: inherit;
        line-height: 1.5;
      }

      textarea:focus-visible,
      button:focus-visible {
        outline: 3px solid #7688f066;
        outline-offset: 2px;
      }

      button {
        width: 100%;
        margin-top: 16px;
        padding: 13px 18px;
        border: 0;
        border-radius: 11px;
        background: #4355bd;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button:hover {
        background: #3547aa;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #result {
        min-height: 1.5em;
        margin: 20px 0 0;
        font-weight: 650;
      }

      #result.positive {
        color: #18764b;
      }

      #result.negative,
      #result.error {
        color: #b42335;
      }

      #result.neutral {
        color: #8a5a00;
      }

      .privacy {
        margin: 20px 0 0;
        color: #737e91;
        font-size: 0.82rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Text classifier</p>
      <h1>How does this review feel?</h1>
      <p class="intro">Enter a review in English, Arabic, or French to predict whether its sentiment is positive, neutral, or negative.</p>

      <form id="prediction-form">
        <label for="review">Your review</label>
        <textarea id="review" name="review" dir="auto" placeholder="Type or paste a review..." required></textarea>
        <button id="submit" type="submit">Analyze sentiment</button>
      </form>

      <p id="result" role="status" aria-live="polite"></p>
      <p class="privacy">Your text is sent to this app for prediction. This project does not save submitted text.</p>
    </main>

    <script>
      const form = document.querySelector("#prediction-form");
      const review = document.querySelector("#review");
      const submit = document.querySelector("#submit");
      const result = document.querySelector("#result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = review.value.trim();
        result.className = "";

        if (!text) {
          result.textContent = "Please enter a review first.";
          result.classList.add("error");
          review.focus();
          return;
        }

        submit.disabled = true;
        submit.textContent = "Analyzing...";
        result.textContent = "";

        try {
          const response = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text })
          });
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || "The prediction request failed.");
          }

          result.textContent = `Predicted sentiment: ${data.prediction} (score: ${(data.score * 100).toFixed(1)}%)`;
          if (["positive", "neutral", "negative"].includes(data.prediction)) {
            result.classList.add(data.prediction);
          }
        } catch (error) {
          result.textContent = error.message || "Could not reach the prediction service.";
          result.classList.add("error");
        } finally {
          submit.disabled = false;
          submit.textContent = "Analyze sentiment";
        }
      });
    </script>
  </body>
</html>
